site_name: Promptise Foundry
site_description: "Promptise Foundry documentation: build AI agents, MCP servers and autonomous agent runtimes in Python, with quickstarts, guides and the full API reference."
site_url: https://docs.promptise.com
site_author: Promptise Team

hooks:
  # Search titles from each page's own heading, not its nav label.
  - hooks/seo.py
  # Real 301s for moved pages, from the redirects plugin's map.
  - hooks/vercel_redirects.py

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - search.suggest
    - search.highlight
    - header.autohide

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - meta-descriptions:
      export_csv: false
      quiet: true
      enable_checks: false
      trim: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_date
      fallback_to_build_date: true
      # Pages the blog plugin generates have no git history of their own.
      exclude:
        - blog/archive/*
        - blog/category/*
  - redirects:
      # Pages merged into the promptise.com guides. Blog posts are keyed by their
      # URL (blog/<slug>.md -> /blog/<slug>/), not by their source path.
      redirect_maps:
