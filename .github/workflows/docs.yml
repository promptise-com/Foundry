name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'hooks/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for git-revision-date plugin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mkdocs gh-deploy --force
      # GitHub Pages can't send a real 301, so docs.promptise.com is served from
      # Vercel. Skipped until the VERCEL_TOKEN secret exists.
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: site
        run: |
          npx --yes vercel@64.7.0 project add promptise-docs --token "$VERCEL_TOKEN" || true
          npx --yes vercel@64.7.0 link --yes --project promptise-docs --token "$VERCEL_TOKEN"
          npx --yes vercel@64.7.0 deploy --prod --yes --token "$VERCEL_TOKEN"
